name = "manufacturing-erp-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "manufacturing-erp-db"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"   # local dev works with any value
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGIN = "*"   # set to your Pages URL in production
# Secrets (never commit): wrangler secret put JWT_SECRET
